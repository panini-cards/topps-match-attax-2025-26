<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Match Attax 25/26 · Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
/* ─── TOKENS ─────────────────────────────────────────── */
:root {
  --ink:    #0a0a0f;
  --paper:  #f5f4f0;
  --smoke:  #e8e6df;
  --mist:   #d0cdc4;
  --dim:    #9996908;
  --soft:   #706d65;
  --body:   #3a3730;
  --title:  #1a1814;

  --blue:   #2563FF;
  --blue2:  #1d4ed8;
  --violet: #7c3aed;
  --pink:   #ec4899;
  --amber:  #f59e0b;
  --green:  #10b981;
  --red:    #ef4444;
  --cyan:   #06b6d4;

  --r-sm: 8px;
  --r-md: 14px;
  --r-lg: 22px;
  --r-xl: 32px;
  --r-full: 999px;
  --f-display: 'Syne', sans-serif;
  --f-body: 'DM Sans', system-ui, sans-serif;
}

/* ─── RESET ──────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  font-family: var(--f-body);
  background: var(--paper);
  color: var(--body);
  min-height: 100vh;
  overflow-x: hidden;
}

/* ─── NOISE TEXTURE OVERLAY ──────────────────────────── */
body::after {
  content: '';
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 9999;
  opacity: .025;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  background-size: 200px;
}

/* ─── HERO HEADER ────────────────────────────────────── */
#hero {
  position: relative;
  background: var(--ink);
  color: #fff;
  overflow: hidden;
  padding: 3rem 2.5rem 0;
}

.hero-bg {
  position: absolute;
  inset: 0;
  background:
    radial-gradient(ellipse 100% 80% at 70% 110%, rgba(37,99,255,.5) 0%, transparent 55%),
    radial-gradient(ellipse 60% 60% at 0% 0%,   rgba(124,58,237,.4) 0%, transparent 50%),
    radial-gradient(ellipse 80% 60% at 100% 0%,  rgba(236,72,153,.25) 0%, transparent 50%);
  pointer-events: none;
}

.hero-grid-lines {
  position: absolute;
  inset: 0;
  background-image:
    linear-gradient(rgba(255,255,255,.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,.04) 1px, transparent 1px);
  background-size: 60px 60px;
  pointer-events: none;
}

.hero-inner {
  position: relative;
  z-index: 2;
  max-width: 1400px;
  margin: 0 auto;
}

.hero-top {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 2rem;
  flex-wrap: wrap;
}

.hero-brand {
  display: flex;
  flex-direction: column;
  gap: .2rem;
}

.hero-eyebrow {
  font-family: var(--f-display);
  font-size: .7rem;
  font-weight: 600;
  letter-spacing: .2em;
  text-transform: uppercase;
  color: rgba(255,255,255,.45);
}

.hero-title {
  font-family: var(--f-display);
  font-size: clamp(2.2rem, 5vw, 4rem);
  font-weight: 800;
  line-height: .95;
  letter-spacing: -.03em;
  color: #fff;
}

.hero-title em {
  font-style: normal;
  background: linear-gradient(90deg, #60a5fa, #a78bfa, #f472b6);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.hero-subtitle {
  font-size: .9rem;
  color: rgba(255,255,255,.45);
  margin-top: .4rem;
  font-weight: 400;
}

/* Big stats row */
.hero-stats {
  display: flex;
  gap: 0;
  margin-top: 2.5rem;
  border-top: 1px solid rgba(255,255,255,.08);
}

.hero-stat {
  flex: 1;
  padding: 1.4rem 1.5rem;
  border-right: 1px solid rgba(255,255,255,.08);
  position: relative;
  cursor: default;
}
.hero-stat:last-child { border-right: none; }

.hero-stat-label {
  font-size: .65rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: .15em;
  color: rgba(255,255,255,.35);
  margin-bottom: .3rem;
}

.hero-stat-value {
  font-family: var(--f-display);
  font-size: 2.2rem;
  font-weight: 800;
  color: #fff;
  line-height: 1;
  letter-spacing: -.04em;
}

.hero-stat-sub {
  font-size: .75rem;
  color: rgba(255,255,255,.4);
  margin-top: .2rem;
}

.hero-stat.accent .hero-stat-value {
  background: linear-gradient(90deg, #60a5fa, #a78bfa);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

/* Progress bar across full hero bottom */
.hero-progress {
  height: 3px;
  background: rgba(255,255,255,.1);
  margin-top: -.5px;
}
.hero-progress-fill {
  height: 100%;
  background: linear-gradient(90deg, #3b82f6, #8b5cf6, #ec4899);
  transition: width .6s cubic-bezier(.4,0,.2,1);
}

/* Header actions (theme + import/export) */
.hero-actions {
  display: flex;
  align-items: center;
  gap: .5rem;
  padding-top: .25rem;
}

.icon-btn {
  width: 38px; height: 38px;
  border-radius: var(--r-md);
  border: 1px solid rgba(255,255,255,.12);
  background: rgba(255,255,255,.06);
  color: rgba(255,255,255,.7);
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 1rem;
  transition: background .15s, border-color .15s;
  flex-shrink: 0;
}
.icon-btn:hover { background: rgba(255,255,255,.12); border-color: rgba(255,255,255,.2); }

/* ─── TOOLBAR ────────────────────────────────────────── */
#toolbar {
  position: sticky;
  top: 0;
  z-index: 100;
  background: rgba(245,244,240,.92);
  backdrop-filter: blur(20px) saturate(160%);
  -webkit-backdrop-filter: blur(20px) saturate(160%);
  border-bottom: 1px solid var(--smoke);
  padding: .7rem 2.5rem;
  display: flex;
  gap: .6rem;
  align-items: center;
  flex-wrap: wrap;
}

/* Search */
.search-pill {
  position: relative;
  flex: 1;
  min-width: 200px;
  max-width: 340px;
}
.search-pill svg {
  position: absolute;
  left: .85rem;
  top: 50%;
  transform: translateY(-50%);
  width: 15px; height: 15px;
  color: var(--soft);
  pointer-events: none;
}
#searchInput {
  width: 100%;
  height: 38px;
  padding: 0 .75rem 0 2.4rem;
  border-radius: var(--r-full);
  border: 1.5px solid var(--smoke);
  background: #fff;
  font: inherit;
  font-size: .85rem;
  color: var(--title);
  outline: none;
  transition: border-color .15s, box-shadow .15s;
}
#searchInput:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(37,99,255,.1); }
#searchInput::placeholder { color: var(--mist); }

/* Quick add */
#quickAddForm { display: flex; gap: .4rem; align-items: center; }
#quickAdd {
  height: 38px;
  padding: 0 .75rem;
  border-radius: var(--r-full);
  border: 1.5px solid var(--smoke);
  background: #fff;
  font: inherit;
  font-size: .85rem;
  color: var(--title);
  width: 170px;
  outline: none;
  transition: border-color .15s, box-shadow .15s;
}
#quickAdd:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(37,99,255,.1); }
#quickAdd::placeholder { color: var(--mist); }

.add-btn {
  height: 38px;
  padding: 0 1rem;
  border-radius: var(--r-full);
  border: none;
  background: var(--blue);
  color: #fff;
  font: inherit;
  font-size: .85rem;
  font-weight: 600;
  cursor: pointer;
  transition: background .15s, transform .1s;
  white-space: nowrap;
}
.add-btn:hover { background: var(--blue2); }
.add-btn:active { transform: scale(.97); }
#quickAddError { font-size: .75rem; color: var(--red); white-space: nowrap; }

/* Filter chips */
#chips { display: flex; gap: .3rem; }
.chip {
  height: 34px;
  padding: 0 .85rem;
  border-radius: var(--r-full);
  border: 1.5px solid var(--smoke);
  background: transparent;
  color: var(--soft);
  font: inherit;
  font-size: .78rem;
  font-weight: 600;
  cursor: pointer;
  transition: all .15s;
  white-space: nowrap;
  letter-spacing: .02em;
}
.chip:hover { background: var(--smoke); color: var(--title); }
.chip.active {
  background: var(--ink);
  border-color: var(--ink);
  color: #fff;
}

/* Export dropdown */
#exportMenu { position: relative; }
#exportMenu > summary { list-style: none; cursor: pointer; }
#exportMenu > summary::-webkit-details-marker { display: none; }
.tb-btn {
  height: 38px;
  padding: 0 .9rem;
  border-radius: var(--r-full);
  border: 1.5px solid var(--smoke);
  background: #fff;
  color: var(--body);
  font: inherit;
  font-size: .82rem;
  font-weight: 500;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: .4rem;
  transition: border-color .15s, background .15s;
  white-space: nowrap;
}
.tb-btn:hover { background: var(--smoke); border-color: var(--mist); }
#exportMenu ul {
  position: absolute;
  right: 0; top: calc(100% + .5rem);
  background: #fff;
  border: 1.5px solid var(--smoke);
  border-radius: var(--r-lg);
  list-style: none;
  padding: .5rem;
  z-index: 200;
  min-width: 190px;
  box-shadow: 0 12px 40px rgba(0,0,0,.12), 0 2px 8px rgba(0,0,0,.06);
  animation: pop-in .12s cubic-bezier(.34,1.56,.64,1);
}
@keyframes pop-in {
  from { opacity:0; transform:scale(.94) translateY(-4px); }
  to   { opacity:1; transform:scale(1) translateY(0); }
}
#exportMenu li button {
  display: flex; align-items: center; gap: .55rem;
  width: 100%; text-align: left;
  padding: .5rem .7rem;
  background: transparent; color: var(--body);
  border: 0; border-radius: var(--r-sm);
  cursor: pointer; font: inherit; font-size: .85rem;
  transition: background .1s;
}
#exportMenu li button:hover { background: var(--smoke); }

.import-lbl { cursor: pointer; }
.import-lbl input { display: none; }

/* ─── MAIN LAYOUT ────────────────────────────────────── */
#layout {
  display: grid;
  grid-template-columns: 240px 1fr;
  max-width: 1400px;
  margin: 0 auto;
  padding: 2rem 2.5rem;
  gap: 2rem;
  align-items: start;
}

@media (max-width: 860px) {
  #layout { grid-template-columns: 1fr; }
  #sidebar { display: none; }
  #hero, #toolbar { padding-left: 1.25rem; padding-right: 1.25rem; }
  #layout { padding: 1.25rem; }
}

/* ─── SIDEBAR ────────────────────────────────────────── */
#sidebar {
  position: sticky;
  top: 62px;
  max-height: calc(100vh - 80px);
  overflow-y: auto;
  scrollbar-width: none;
}
#sidebar::-webkit-scrollbar { display: none; }

.sidebar-head {
  font-family: var(--f-display);
  font-size: .65rem;
  font-weight: 700;
  letter-spacing: .15em;
  text-transform: uppercase;
  color: var(--mist);
  padding: .8rem .6rem .3rem;
  margin-top: .5rem;
}
.sidebar-head:first-child { margin-top: 0; padding-top: 0; }

.s-row {
  display: flex;
  align-items: center;
  gap: .55rem;
  padding: .42rem .6rem;
  border-radius: var(--r-sm);
  cursor: pointer;
  transition: background .1s;
  font-size: .8rem;
  color: var(--body);
}
.s-row:hover { background: var(--smoke); }
.s-row.active { background: var(--ink); color: #fff; }
.s-row.complete { background: rgba(16,185,129,.1); color: var(--green); font-weight: 600; }
.s-row.complete-incoming { background: rgba(245,158,11,.1); color: var(--incoming-fg); font-weight: 600; }

.s-dot {
  width: 7px; height: 7px;
  border-radius: 2px;
  flex-shrink: 0;
}

.s-name {
  flex: 1;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-weight: 500;
}

.s-bar {
  width: 40px; height: 2px;
  background: var(--smoke);
  border-radius: 99px;
  overflow: hidden;
  flex-shrink: 0;
}
.s-bar > b {
  display: block; height: 100%;
  background: var(--blue);
  border-radius: 99px;
}
.s-row.complete .s-bar > b { background: var(--green); }
.s-row.complete-incoming .s-bar > b { background: var(--amber); }
.s-row.active .s-bar { background: rgba(255,255,255,.2); }
.s-row.active .s-bar > b { background: #fff; }

.s-count {
  font-size: .72rem;
  color: var(--mist);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.s-row.active .s-count { color: rgba(255,255,255,.5); }
.s-row.complete .s-count { color: var(--green); opacity: .8; }
.s-row.complete-incoming .s-count { color: var(--amber); opacity: .8; }

#clearFilter {
  margin-top: .75rem;
  width: 100%;
  height: 34px;
  border-radius: var(--r-full);
  border: 1.5px solid var(--smoke);
  background: transparent;
  color: var(--soft);
  font: inherit;
  font-size: .8rem;
  cursor: pointer;
  transition: all .15s;
}
#clearFilter:hover { background: var(--smoke); color: var(--title); }

/* ─── CARD GRID ──────────────────────────────────────── */
#grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
  gap: .6rem;
}

/* ─── THE CARD ───────────────────────────────────────── */
.card {
  --c-accent: var(--blue);
  position: relative;
  aspect-ratio: 2.5 / 3.5;
  border-radius: var(--r-lg);
  cursor: pointer;
  user-select: none;
  transition: transform .2s cubic-bezier(.34,1.3,.64,1), box-shadow .2s;
  overflow: hidden;
  background: #fff;
  border: 1.5px solid var(--smoke);
}

.card:hover {
  transform: translateY(-6px) scale(1.02);
  box-shadow: 0 20px 50px rgba(0,0,0,.14), 0 4px 12px rgba(0,0,0,.06);
  z-index: 2;
}
.card:active { transform: scale(.97); transition-duration: .1s; }

/* Card face */
.card-face {
  position: absolute; inset: 0;
  display: flex; flex-direction: column;
  padding: .45rem .45rem .4rem; gap: .18rem;
}

/* Gradient top stripe */
.card-stripe {
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 38%;
  border-radius: var(--r-lg) var(--r-lg) 60% 60% / var(--r-lg) var(--r-lg) 30% 30%;
  background: linear-gradient(135deg, var(--c-accent), color-mix(in srgb, var(--c-accent) 60%, #fff));
  opacity: .12;
  transition: opacity .2s;
}
.card.owned .card-stripe { opacity: .22; }

/* Large number */
.card-num {
  font-family: var(--f-display);
  font-size: 1.15rem; font-weight: 800;
  color: var(--c-accent);
  letter-spacing: -.04em; line-height: 1;
  position: relative; z-index: 1;
}

/* Player silhouette / placeholder art */
.card-art {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  z-index: 1;
}

.card-avatar {
  width: 40px; height: 40px; border-radius: 50%;
  background: linear-gradient(135deg, var(--c-accent), color-mix(in srgb, var(--c-accent) 50%, var(--violet)));
  display: flex; align-items: center; justify-content: center;
  font-family: var(--f-display); font-size: .85rem; font-weight: 800;
  color: rgba(255,255,255,.9);
  flex-shrink: 0; opacity: .65; transition: opacity .2s;
}
.card.owned .card-avatar { opacity: 1; }

/* Card bottom info */
.card-info {
  position: relative;
  z-index: 1;
}

.card-name {
  font-size: .65rem; font-weight: 600;
  color: var(--title); line-height: 1.2;
  overflow: hidden;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
}

.card-team {
  font-size: .57rem; color: var(--soft);
  margin-top: .08rem;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}

/* Section badge pill */
.card-badge {
  position: absolute;
  top: .5rem;
  right: .5rem;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--c-accent);
  z-index: 2;
  box-shadow: 0 0 6px var(--c-accent);
}

/* Owned state */
.card.owned {
  border-color: var(--c-accent);
  background: color-mix(in srgb, var(--c-accent) 5%, #fff);
  box-shadow: 0 0 0 1px var(--c-accent), inset 0 0 30px color-mix(in srgb, var(--c-accent) 8%, transparent);
}

/* Owned checkmark */
.card-check {
  position: absolute; bottom: .42rem; right: .42rem;
  width: 18px; height: 18px; border-radius: 50%;
  background: var(--c-accent);
  display: flex; align-items: center; justify-content: center;
  opacity: 0; transform: scale(.5);
  transition: opacity .2s, transform .2s cubic-bezier(.34,1.56,.64,1);
  z-index: 3;
}
.card-check svg { width: 10px; height: 10px; stroke: #fff; stroke-width: 2.5; }
.card.owned .card-check { opacity: 1; transform: scale(1); }

/* Copy count badge */
.card-copies {
  position: absolute;
  top: .45rem;
  left: .45rem;
  background: var(--ink);
  color: #fff;
  border-radius: var(--r-full);
  font-size: .6rem;
  font-weight: 700;
  padding: .1rem .35rem;
  z-index: 3;
  opacity: 0;
  transition: opacity .15s;
}
.card.owned .card-copies { opacity: 1; }
.card-copies.single { display: none; }

/* Incoming/reserved */
.card.reserved {
  border-color: var(--amber);
  background: color-mix(in srgb, var(--amber) 5%, #fff);
}
.card.reserved .card-num { color: var(--amber); }
.card.reserved .card-badge { background: var(--amber); box-shadow: 0 0 6px var(--amber); }

/* Holographic shimmer on owned insert cards */
.card.owned.insert::after {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: inherit;
  background: linear-gradient(
    105deg,
    transparent 20%, rgba(255,255,255,.4) 35%,
    transparent 50%, rgba(255,255,255,.2) 65%,
    transparent 80%
  );
  background-size: 200% 100%;
  animation: holo 3s linear infinite;
  pointer-events: none;
  z-index: 4;
  mix-blend-mode: overlay;
}
@keyframes holo {
  0%   { background-position: 200% 0; }
  100% { background-position: -200% 0; }
}

/* ─── EMPTY STATE ────────────────────────────────────── */
.empty {
  grid-column: 1/-1;
  padding: 5rem 2rem;
  text-align: center;
  color: var(--mist);
}
.empty svg { width: 56px; height: 56px; margin-bottom: 1rem; opacity: .4; }
.empty p { font-size: .9rem; }

/* ─── TOAST ──────────────────────────────────────────── */
#toast {
  position: fixed;
  bottom: 2rem;
  left: 50%;
  transform: translateX(-50%) translateY(12px);
  background: var(--ink);
  color: #fff;
  padding: .65rem 1.4rem;
  border-radius: var(--r-full);
  font-size: .85rem;
  font-weight: 500;
  opacity: 0;
  transition: opacity .2s, transform .2s cubic-bezier(.34,1.3,.64,1);
  pointer-events: none;
  z-index: 9000;
  white-space: nowrap;
  box-shadow: 0 8px 24px rgba(0,0,0,.25);
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ─── DIALOG ─────────────────────────────────────────── */
dialog {
  background: #fff;
  border: 1.5px solid var(--smoke);
  border-radius: var(--r-xl);
  color: var(--body);
  padding: 2rem;
  max-width: 420px;
  width: 95vw;
  box-shadow: 0 24px 60px rgba(0,0,0,.2);
}
dialog::backdrop { background: rgba(0,0,0,.45); backdrop-filter: blur(6px); }
dialog h3 {
  font-family: var(--f-display);
  font-size: 1.15rem;
  font-weight: 700;
  color: var(--title);
  margin-bottom: 1.2rem;
}
.d-label {
  display: block;
  font-size: .75rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: .1em;
  color: var(--soft);
  margin-bottom: .4rem;
}
.d-input {
  width: 7rem;
  height: 42px;
  padding: 0 .75rem;
  border-radius: var(--r-sm);
  border: 1.5px solid var(--smoke);
  background: var(--paper);
  font: inherit;
  font-size: 1rem;
  color: var(--title);
  outline: none;
  transition: border-color .15s;
  margin-bottom: 1rem;
}
.d-input:focus { border-color: var(--blue); }
.d-check-row {
  display: flex; align-items: center; gap: .6rem;
  font-size: .85rem;
  margin-bottom: 1rem;
}
.d-check-row input { width: 16px; height: 16px; accent-color: var(--blue); cursor: pointer; }
dialog menu {
  display: flex; gap: .5rem; justify-content: flex-end;

<script>
/* ── Pure app object ───────────────────────────────── */
window.__app = {
  SECTION_LABELS: {
    'Squad Update':'Squad Update','Manager':'Manager','Away Kit':'Away Kit',
    "UEFA Women's Champions League":"Women's UCL",'Wingman':'Wingman',
    'Pitch Perfection':'Pitch Perfection','Kings of Europe':'Kings of Europe',
    'Hat-Trick Hero':'Hat-Trick Hero',
    'Topps Heritage - Man of the Match':'Heritage: MoM',
    'Topps Heritage - Woman of the Match':'Heritage: WoM',
    '100 Club':'100 Club',"100 Club UEFA Women's Champions League":"100 Club W.",
    '100 Club Legend':'100 Club Legend','Clutch Kids':'Clutch Kids',
    'UEFA Official Matchball':'Matchball','Match Attax Extra Title Card':'Title Card',
    'UEFA 2026 Finals':'2026 Finals',
    'Limited Edition - ElectriX':'LE ElectriX','Limited Edition - Blitz Ballerz':'LE Blitz Ballerz',
    'Limited Edition - Goaliaths':'LE Goaliaths','Limited Edition - Psykicks':'LE Psykicks',
    'Limited Edition - Stadium Lights':'LE Stadium Lights',
    'Infinity':'Infinity','Chrome X':'Chrome X','Build-a-Baller Ultimate Baller':'Build-a-Baller',
    'Black Edge Edition':'Black Edge','Platinum Pull Limited Edition':'Platinum Pull',
    'X-Calibre':'X-Calibre','Gold Rush Ultra Limited Edition':'Gold Rush',
    'Black Fire Limited Edition':'Black Fire','X Greats Limited Edition':'X Greats',
    'Facsimile Signature Style Pro View':'Pro View (Facs.)','Pro-View Original':'Pro-View Original',
    '3D X-Lens Phase Shifter':'3D X-Lens','Royal Elite Limited Edition':'Royal Elite',
    'Royal Elite Limited Edition – Parallel':'Royal Elite (Par.)',
    'UCL Decades Relic':'UCL Relic','Player-Worn Jersey Relic':'Jersey Relic',
    'Genuine Autograph':'Autograph',
  },
  SECTION_ORDER: [
    'Squad Update','Manager','Away Kit',"UEFA Women's Champions League",
    'Wingman','Pitch Perfection','Kings of Europe','Hat-Trick Hero',
    'Topps Heritage - Man of the Match','Topps Heritage - Woman of the Match',
    '100 Club',"100 Club UEFA Women's Champions League",'100 Club Legend',
    'Clutch Kids','UEFA Official Matchball','Match Attax Extra Title Card','UEFA 2026 Finals',
    'Limited Edition - ElectriX','Limited Edition - Blitz Ballerz','Limited Edition - Goaliaths',
    'Limited Edition - Psykicks','Limited Edition - Stadium Lights',
    'Infinity','Chrome X','Build-a-Baller Ultimate Baller',
    'Black Edge Edition','Platinum Pull Limited Edition','X-Calibre',
    'Gold Rush Ultra Limited Edition','Black Fire Limited Edition','X Greats Limited Edition',
    'Facsimile Signature Style Pro View','Pro-View Original','3D X-Lens Phase Shifter',
    'Royal Elite Limited Edition','Royal Elite Limited Edition – Parallel',
    'UCL Decades Relic','Player-Worn Jersey Relic','Genuine Autograph',
  ],
  SECTION_CSS: {
    'Squad Update':'squad-update','Manager':'manager','Away Kit':'away-kit',
    "UEFA Women's Champions League":'womens','Wingman':'wingman',
    'Pitch Perfection':'pitch-perfection','Kings of Europe':'kings-of-europe',
    'Hat-Trick Hero':'hat-trick-hero',
    'Topps Heritage - Man of the Match':'heritage-mom',
    'Topps Heritage - Woman of the Match':'heritage-wom',
    '100 Club':'100-club',"100 Club UEFA Women's Champions League":'100-club-w',
    '100 Club Legend':'100-club-legend','Clutch Kids':'clutch-kids',
    'UEFA Official Matchball':'special','Match Attax Extra Title Card':'special',
    'UEFA 2026 Finals':'special',
    'Limited Edition - ElectriX':'le','Limited Edition - Blitz Ballerz':'le',
    'Limited Edition - Goaliaths':'le','Limited Edition - Psykicks':'le',
    'Limited Edition - Stadium Lights':'le',
    'Infinity':'infinity','Chrome X':'chrome-x','Build-a-Baller Ultimate Baller':'bab',
    'Black Edge Edition':'black-edge','Platinum Pull Limited Edition':'plat-pull',
    'X-Calibre':'x-calibre','Gold Rush Ultra Limited Edition':'gold-rush',
    'Black Fire Limited Edition':'black-fire','X Greats Limited Edition':'x-greats',
    'Facsimile Signature Style Pro View':'proview','Pro-View Original':'proview',
    '3D X-Lens Phase Shifter':'lens3d','Royal Elite Limited Edition':'royal-elite',
    'Royal Elite Limited Edition – Parallel':'royal-elite',
    'UCL Decades Relic':'ucl-relic','Player-Worn Jersey Relic':'jersey-relic',
    'Genuine Autograph':'autograph',
  },
  BASE_SECS: new Set([
    'Squad Update','Manager','Away Kit',"UEFA Women's Champions League",
    'Wingman','Pitch Perfection','Kings of Europe','Hat-Trick Hero',
    'Topps Heritage - Man of the Match','Topps Heritage - Woman of the Match',
    '100 Club',"100 Club UEFA Women's Champions League",'100 Club Legend',
    'Clutch Kids','UEFA Official Matchball','Match Attax Extra Title Card','UEFA 2026 Finals',
  ]),
  MEM_SECS: new Set(['UCL Decades Relic','Player-Worn Jersey Relic','Genuine Autograph']),

  parseQuickAdd(input) {
    const valid=[], errors=[];
    if (!input?.trim()) return {valid,errors};
    for (const tok of input.split(/[\s,]+/).filter(Boolean)) {
      const m = tok.match(/^(\d+)-(\d+)$/);
      if (m) {
        const [a,b]=[parseInt(m[1]),parseInt(m[2])];
        if (a>b||a<1||b>9999){errors.push(tok);continue;}
        for(let n=a;n<=b;n++) valid.push(n);
      } else if (/^\d+$/.test(tok)) {
        const n=parseInt(tok);
        if(n<1||n>9999){errors.push(tok);continue;}
        valid.push(n);
      } else errors.push(tok);
    }
    return {valid,errors};
  },

  computeStats(checklist, col, rsv={}) {
    let owned=0, doubles=0, incoming=0;
    const perSec={};
    for (const c of checklist) {
      perSec[c.section] = perSec[c.section]||{owned:0,incoming:0,total:0};
      perSec[c.section].total++;
    }
    for (const c of checklist) {
      const cnt = col[c.number]||0;
      if (cnt>=1){ owned++; if(cnt>=2) doubles+=(cnt-1); perSec[c.section].owned++; }
      else if (rsv[c.number]) { incoming++; perSec[c.section].incoming++; }
    }
    return { owned, total:checklist.length, pct:Math.round(100*owned/checklist.length), doubles, incoming, perSec };
  },

  matchesSearch(card, q) {
    if (!q?.trim()) return true;
    const s = q.trim().toLowerCase();
    const m = s.match(/^(\d+)\s*-\s*(\d+)$/);
    if (m) { const lo=+m[1],hi=+m[2]; return lo<=hi && card.number>=lo && card.number<=hi; }
    return String(card.number)===s
      || card.section?.toLowerCase().includes(s)
      || card.player?.toLowerCase().includes(s)
      || card.team?.toLowerCase().includes(s)
      || card.type?.toLowerCase().includes(s);
  },

  _groupByLabel(checklist, fn) {
    const groups=new Map(), order=[];
    for (const sec of this.SECTION_ORDER)
      for (const c of checklist) {
        if (c.section!==sec||!fn(c)) continue;
        const lbl = this.SECTION_LABELS[sec]||sec;
        if (!groups.has(lbl)){groups.set(lbl,[]);order.push(lbl);}
        groups.get(lbl).push(c.number);
      }
    return {groups,order};
  },
  formatMissing(cl,col,rsv={}) {
    const fn=c=>!(col[c.number]>=1)&&!rsv[c.number];
    const {groups,order}=this._groupByLabel(cl,fn);
    const tot=cl.filter(fn).length;
    return [`Missing (${tot}):`,...order.map(l=>`${l}: ${groups.get(l).join(', ')}`)].join('\n');
  },
  formatIncoming(cl,col,rsv={}) {
    const fn=c=>!(col[c.number]>=1)&&!!rsv[c.number];
    const {groups,order}=this._groupByLabel(cl,fn);
    const tot=cl.filter(fn).length;
    return [`Incoming (${tot}):`,...order.map(l=>`${l}: ${groups.get(l).join(', ')}`)].join('\n');
  },
  formatOwned(cl,col) {
    const fn=c=>(col[c.number]||0)>=1;
    const {groups,order}=this._groupByLabel(cl,fn);
    const tot=cl.filter(fn).length;
    return [`Owned (${tot}):`,...order.map(l=>`${l}: ${groups.get(l).join(', ')}`)].join('\n');
  },
  formatDoubles(cl,col) {
    const fn=c=>(col[c.number]||0)>=2;
    const {groups,order}=this._groupByLabel(cl,fn);
    const tot=cl.reduce((s,c)=>s+Math.max(0,(col[c.number]||0)-1),0);
    return [`Doubles — spare copies (${tot}):`,...order.map(l=>{
      const parts=groups.get(l).map(n=>{const sp=col[n]-1;return sp>1?`${n}(×${sp})`:String(n);});
      return `${l}: ${parts.join(', ')}`;
    })].join('\n');
  },
  applyImport(existing, imp, mode) {
    let impCol=imp, impRsv=null;
    if(imp&&typeof imp==='object'&&!Array.isArray(imp)&&(imp.collection!==undefined||imp.reserved!==undefined)){
      impCol=imp.collection||{};impRsv=imp.reserved||{};
    }
    const norm={};
    if(Array.isArray(impCol)){for(const n of impCol){if(typeof n!=='number'||n<1||n>9999)continue;norm[n]=(norm[n]||0)+1;}}
    else if(impCol&&typeof impCol==='object'){
      for(const[k,v]of Object.entries(impCol)){
        const num=parseInt(k),key=String(num)===k?num:k;
        const c=typeof v==='number'?v:parseInt(v);
        if(!isFinite(c)||c<1)continue;norm[key]=c;
      }
    }
    let out;
    if(mode==='replace') out={collection:norm};
    else{const merged={...existing};for(const[k,v]of Object.entries(norm))merged[k]=(merged[k]||0)+v;out={collection:merged};}
    if(impRsv!==null){
      const cr={};
      for(const[k,v]of Object.entries(impRsv)){
        const num=parseInt(k),key=String(num)===k?num:k;
        const c=typeof v==='number'?v:parseInt(v);
        if(!isFinite(c)||c<1)continue;cr[key]=c;
      }
      out.reserved=cr;
    }
    return out;
  },
  SK:'topps_ma2526_collection', RK:'topps_ma2526_reserved',
  storageOk(){try{localStorage.setItem('__t__','1');localStorage.removeItem('__t__');return true;}catch{return false;}},
  load(key){
    try{
      const raw=localStorage.getItem(key); if(!raw) return {};
      const p=JSON.parse(raw); if(!p||typeof p!=='object') return {};
      const out={};
      for(const[k,v]of Object.entries(p)){const c=typeof v==='number'?v:parseInt(v);if(!isFinite(c)||c<1)continue;const n=parseInt(k);out[String(n)===k?n:k]=c;}
      return out;
    }catch{return {};}
  },
  save(key,val){try{localStorage.setItem(key,JSON.stringify(val));}catch{}},
};

/* ── Boot ──────────────────────────────────────────── */
(async ()=>{
  const A=window.__app;
  const $=id=>document.getElementById(id);

  const banner=$('banner');
  if(!A.storageOk()){
    banner.hidden=false;
    banner.textContent='⚠ Storage disabled — use Export to save manually.';
  }

  let checklist;
  try {
    const r=await fetch('https://panini-cards.github.io/topps-match-attax-2025-26/checklist.json');
    if(!r.ok) throw new Error('HTTP '+r.status);
    checklist=await r.json();
    if(!Array.isArray(checklist)||!checklist.length) throw new Error('Empty');
  } catch(e) {
    banner.hidden=false; banner.classList.add('err');
    const msg=document.createElement('span'); msg.textContent='❌ Could not load checklist — '+e.message+'. ';
    const btn=document.createElement('button'); btn.textContent='Reload'; btn.onclick=()=>location.reload();
    banner.append(msg,btn); return;
  }

  // Sort checklist by SECTION_ORDER index, then numerically within each section
  const secIdx = Object.fromEntries(A.SECTION_ORDER.map((s,i)=>[s,i]));
  function cardSortNum(n){
    // extract trailing digits for within-section ordering: 'BAB3' → 3, '42' → 42
    const m = String(n).match(/(\d+)$/);
    return m ? parseInt(m[1], 10) : 0;
  }
  checklist.sort((a,b)=>{
    const si = (secIdx[a.section]??999) - (secIdx[b.section]??999);
    if (si !== 0) return si;
    return cardSortNum(a.number) - cardSortNum(b.number);
  });

  let col=A.load(A.SK), rsv=A.load(A.RK);
  let filterSec=null, chip='all', search='';

  const INSERT_TYPES = new Set(['Insert','Limited Edition','Autograph','Relic']);
  function isInsert(c){ return !A.BASE_SECS.has(c.section)&&!A.MEM_SECS.has(c.section); }

  function visible(c){
    if(filterSec&&c.section!==filterSec) return false;
    const cnt=col[c.number]||0, inc=!cnt&&(rsv[c.number]||0)>0;
    if(chip==='owned'&&!cnt) return false;
    if(chip==='missing'&&(cnt||inc)) return false;
    if(chip==='incoming'&&!inc) return false;
    if(chip==='doubles'&&cnt<2) return false;
    if(chip==='giveaways'&&cnt<3) return false;
    return A.matchesSearch(c,search);
  }

  function initials(name){
    if(!name) return '?';
    return name.split(' ').filter(Boolean).map(w=>w[0]).join('').slice(0,2).toUpperCase();
  }

  function makeCard(c){
    const cnt=col[c.number]||0, owned=cnt>=1, isRsv=!owned&&(rsv[c.number]||0)>0;
    const css=A.SECTION_CSS[c.section]||'';
    const ins=isInsert(c);

    const el=document.createElement('div');
    el.className='card'+(owned?' owned':'')+(isRsv?' reserved':'')+(ins&&owned?' insert':'')+(css?' sa-'+css:'');
    el.dataset.n=c.number;

    el.innerHTML=`
      <div class="card-stripe"></div>
      <div class="card-badge" title="${c.section}"></div>
      <div class="card-face">
        <div class="card-num">#${c.number}</div>
        <div class="card-art">
          <div class="card-avatar">${initials(c.player)}</div>
        </div>
        <div class="card-info">
          <div class="card-name">${c.player||c.type||''}</div>
          <div class="card-team">${c.team&&c.team!=='-'?c.team:(A.SECTION_LABELS[c.section]||c.section)}</div>
        </div>
      </div>
      <div class="card-copies${cnt<=1?' single':''}">×${cnt}</div>
      <div class="card-check">
        <svg fill="none" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
      </div>`;
    return el;
  }

  function renderGrid(){
    const grid=$('grid');
    grid.textContent='';
    let n=0;
    for(const c of checklist){
      if(!visible(c)) continue;
      grid.appendChild(makeCard(c));
      n++;
    }
    if(!n){
      const e=document.createElement('div');
      e.className='empty';
      e.innerHTML=`<svg fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg><p>No cards match your filter.</p>`;
      grid.appendChild(e);
    }
  }

  function renderStats(){
    const s=A.computeStats(checklist,col,rsv);
    $('ownedCount').textContent=s.owned;
    $('ownedTotal').textContent=s.total;
    $('ownedPct').textContent=s.pct+'%';
    $('missingCount').textContent=s.total-s.owned-s.incoming;
    $('doublesCount').textContent=s.doubles;
    $('incomingCount').textContent=s.incoming;
    $('overallBar').style.width=s.pct+'%';
    renderSidebar(s);
  }

  function renderSidebar(stats){
    const el=$('summary'); el.textContent='';
    let didIns=false, didMem=false, didBase=false;

    for(const sec of A.SECTION_ORDER){
      const info=stats.perSec[sec]; if(!info) continue;
      const lbl=A.SECTION_LABELS[sec]||sec, css=A.SECTION_CSS[sec]||'';
      const isBase=A.BASE_SECS.has(sec), isMem=A.MEM_SECS.has(sec);

      if(isBase&&!didBase){
        const h=document.createElement('div'); h.className='sidebar-head'; h.textContent='Base Cards';
        el.appendChild(h); didBase=true;
      }
      if(!isBase&&!isMem&&!didIns){
        const h=document.createElement('div'); h.className='sidebar-head'; h.textContent='Inserts & Specials';
        el.appendChild(h); didIns=true;
      }
      if(isMem&&!didMem){
        const h=document.createElement('div'); h.className='sidebar-head'; h.textContent='Memorabilia & Autos';
        el.appendChild(h); didMem=true;
      }

      const pct=info.total>0?Math.round(100*info.owned/info.total):0;
      const complete=info.total>0&&info.owned===info.total;
      const completeInc=!complete&&info.owned+info.incoming===info.total;

      const row=document.createElement('div');
      row.className='s-row'+(complete?' complete':completeInc?' complete-incoming':'')+(filterSec===sec?' active':'');
      row.dataset.sec=sec;
      row.innerHTML=`
        <span class="s-dot sd-${css||'squad-update'}"></span>
        <span class="s-name">${lbl}</span>
        <div class="s-bar"><b style="width:${pct}%"></b></div>
        <span class="s-count">${info.owned}/${info.total}</span>`;
      el.appendChild(row);
    }

    if(filterSec){
      const btn=document.createElement('button');
      btn.id='clearFilter'; btn.className=''; btn.type='button';
      btn.style='margin-top:.75rem;width:100%;height:34px;border-radius:999px;border:1.5px solid #e8e6df;background:transparent;font:inherit;font-size:.8rem;cursor:pointer;color:#706d65;transition:background .15s';
      btn.textContent='✕ Show all sections';
      el.appendChild(btn);
    }
  }

  function render(){renderGrid();renderStats();}

  function cardKey(raw){const n=parseInt(raw);return String(n)===String(raw)?n:raw;}

  /* ── Interactions ───────────────────────── */
  const grid=$('grid');

  grid.addEventListener('click', e=>{
    const c=e.target.closest('.card'); if(!c) return;
    if(_lp){_lp=false;return;}
    const n=cardKey(c.dataset.n), cnt=col[n]||0;
    if(!cnt){col[n]=1;delete rsv[n];}else delete col[n];
    A.save(A.SK,col); A.save(A.RK,rsv);
    c.classList.add('popping');
    c.addEventListener('animationend',()=>c.classList.remove('popping'),{once:true});
    render();
  });

  grid.addEventListener('contextmenu',e=>{
    const c=e.target.closest('.card');if(!c)return;
    e.preventDefault();openEdit(cardKey(c.dataset.n));
  });

  let _lp=false,_pt=null;
  grid.addEventListener('touchstart',e=>{
    const c=e.target.closest('.card');if(!c)return;
    const n=cardKey(c.dataset.n);
    _pt=setTimeout(()=>{_lp=true;openEdit(n);},500);
  },{passive:true});
  const cancelPT=()=>{if(_pt){clearTimeout(_pt);_pt=null;}};
  grid.addEventListener('touchend',cancelPT);
  grid.addEventListener('touchmove',cancelPT);
  grid.addEventListener('touchcancel',cancelPT);

  $('summary').addEventListener('click',e=>{
    const btn=e.target.closest('#clearFilter');
    if(btn){filterSec=null;render();return;}
    const row=e.target.closest('.s-row[data-sec]');if(!row)return;
    filterSec=filterSec===row.dataset.sec?null:row.dataset.sec;
    render();
  });

  $('chips').addEventListener('click',e=>{
    const b=e.target.closest('.chip');if(!b)return;
    chip=b.dataset.chip;
    document.querySelectorAll('.chip').forEach(x=>x.classList.toggle('active',x===b));
    render();
  });

  $('searchInput').addEventListener('input',e=>{search=e.target.value;render();});

  /* Quick add */
  $('quickAddForm').addEventListener('submit',e=>{
    e.preventDefault();
    const {valid,errors}=A.parseQuickAdd($('quickAdd').value);
    const known=new Set(checklist.map(c=>c.number));
    const orphan=valid.filter(n=>!known.has(n));
    const parts=[];
    if(errors.length) parts.push('Rejected: '+errors.join(', '));
    if(orphan.length) parts.push('Not found: '+orphan.join(', '));
    $('quickAddError').textContent=parts.join(' · ');
    if(!valid.length)return;
    for(const n of valid) col[n]=(col[n]||0)+1;
    A.save(A.SK,col);
    $('quickAdd').value='';
    render();
    const shown=valid.filter(n=>known.has(n)).length;
    toast(`✅ +${shown} card${shown===1?'':'s'} added`+(orphan.length?' ('+orphan.length+' unknown)':''));
  });

  /* Toast */
  const toastEl=$('toast'); let _tt=null,_th=null;
  function toast(msg){
    toastEl.textContent=msg; toastEl.hidden=false;
    void toastEl.offsetWidth; toastEl.classList.add('show');
    clearTimeout(_tt);clearTimeout(_th);
    _tt=setTimeout(()=>{toastEl.classList.remove('show');_th=setTimeout(()=>{toastEl.hidden=true;},300);},2200);
  }

  /* Card edit dialog */
  const editDlg=$('cardEditModal'), editTitle=$('cardEditTitle');
  const editCount=$('cardEditCount'), editRsv=$('cardEditReserved'), editRsvRow=$('cardEditReservedRow');
  let editN=null;
  function openEdit(n){
    editN=n;
    const cnt=col[n]||0;
    const card=checklist.find(c=>String(c.number)===String(n));
    editTitle.textContent='#'+n+(card?' · '+(card.player||card.type||''):'');
    editCount.value=String(cnt);
    editRsv.checked=(rsv[n]||0)>0;
    editRsvRow.style.display=cnt===0?'':'none';
    editDlg.showModal?.()??editDlg.setAttribute('open','');
    editCount.focus();editCount.select();
  }
  editCount.addEventListener('input',()=>{
    const v=parseInt(editCount.value);
    editRsvRow.style.display=(isFinite(v)&&v===0)?'':'none';
  });
  $('cardEditSave').addEventListener('click',()=>{
    if(editN===null)return;
    const raw=editCount.value.trim(), c=parseInt(raw);
    if(!isFinite(c)||c<0||String(c)!==raw){closeEdit();return;}
    if(c===0){delete col[editN];if(editRsv.checked)rsv[editN]=1;else delete rsv[editN];}
    else{col[editN]=c;delete rsv[editN];}
    A.save(A.SK,col);A.save(A.RK,rsv);
    closeEdit();render();
  });
  $('cardEditCancel').addEventListener('click',closeEdit);
  function closeEdit(){editDlg.close?.()??editDlg.removeAttribute('open');}

  /* Text modal */
  const txtDlg=$('textModal'), txtBody=$('textModalBody'), txtTitle=$('textModalTitle');
  function openText(title,body){txtTitle.textContent=title;txtBody.value=body;txtDlg.showModal?.()??txtDlg.setAttribute('open','');}
  $('textModalClose').addEventListener('click',()=>txtDlg.close?.()??txtDlg.removeAttribute('open'));
  $('textModalCopy').addEventListener('click',async e=>{
    try{await navigator.clipboard.writeText(txtBody.value);}
    catch{txtBody.select();document.execCommand('copy');}
    const orig=e.currentTarget.textContent;
    e.currentTarget.textContent='✓ Copied!';
    setTimeout(()=>{e.currentTarget.textContent=orig;},1500);
  });

  /* Export / import */
  function handleExport(kind){
    if(kind==='json'){
      const data=Object.keys(rsv).length>0?{collection:col,reserved:rsv}:col;
      const a=document.createElement('a');
      a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));
      a.download='topps-ma2526-'+new Date().toISOString().slice(0,10)+'.json';
      document.body.appendChild(a);a.click();a.remove();
      toast('💾 Saved '+a.download);
    } else if(kind==='owned')    openText('Owned cards',   A.formatOwned(checklist,col));
    else if(kind==='missing')    openText('Missing cards',  A.formatMissing(checklist,col,rsv));
    else if(kind==='incoming')   openText('Incoming cards', A.formatIncoming(checklist,col,rsv));
    else if(kind==='doubles')    openText('Doubles',        A.formatDoubles(checklist,col));
  }

  const exportMenu = $('exportMenu');
  exportMenu.addEventListener('click',e=>{
    const b=e.target.closest('button[data-export]');if(!b)return;
    handleExport(b.dataset.export);
    exportMenu.open=false;
  });
  document.addEventListener('click',e=>{
    if(exportMenu.open&&!exportMenu.contains(e.target))exportMenu.open=false;
  });

  $('importFile').addEventListener('change',async e=>{
    const file=e.target.files?.[0];if(!file)return;
    let parsed; try{parsed=JSON.parse(await file.text());}
    catch{alert('Not valid JSON.');e.target.value='';return;}
    const merge=confirm('OK = Merge\nCancel = Replace');
    const res=A.applyImport(col,parsed,merge?'merge':'replace');
    col=res.collection;if(res.reserved!==undefined)rsv=res.reserved;
    A.save(A.SK,col);A.save(A.RK,rsv);
    render();toast('✅ Import applied');e.target.value='';
  });

  /* Theme */
  const themeBtn=$('themeToggle');
  const THEMES=['dark','light'];
  const LABELS={dark:'🌙',light:'☀️'};
  function getTheme(){return document.documentElement.dataset.theme||'dark';}
  function setTheme(t){
    document.documentElement.dataset.theme=t;
    themeBtn.textContent=LABELS[t];
    try{localStorage.setItem('topps_ma2526_theme',t);}catch{}
    // apply light mode overrides
    const isLight=t==='light';
    document.getElementById('hero').style.background=isLight?'#0a0a0f':'';
  }

  // Apply saved
  const saved=localStorage.getItem?.('topps_ma2526_theme');
  setTheme(THEMES.includes(saved)?saved:'dark');
  themeBtn.addEventListener('click',()=>{
    const i=THEMES.indexOf(getTheme());
    setTheme(THEMES[(i+1)%THEMES.length]);
  });

  render();
})();
</script>
</body>
</html>
